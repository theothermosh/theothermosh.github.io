<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Jekyll SEO and Title tags -->
    <title>{{ page.title | default: site.title }}</title>
    
    <!-- Dark Mode Script (Placed in head to prevent Flash of Unstyled Content) -->
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Academic and Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    },
                    colors: {
                        academic: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            500: '#3b82f6',
                            600: '#2563eb',
                            800: '#1e293b',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        .nav-link { transition: color 0.2s ease-in-out; }
        .nav-link:hover { color: #2563eb; }
        .dark .nav-link:hover { color: #60a5fa; }
        .pub-link { transition: all 0.2s; }
        .pub-link:hover { background-color: #2563eb; color: white; border-color: #2563eb; }
        .dark .pub-link:hover { background-color: #3b82f6; color: white; border-color: #3b82f6; }
    </style>
</head>
<body class="bg-academic-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 antialiased flex flex-col min-h-screen transition-colors duration-300">

    <!-- Navigation Bar -->
    <header class="fixed w-full bg-white/90 dark:bg-gray-900/90 backdrop-blur-sm shadow-sm z-50 border-b border-gray-100 dark:border-gray-800 transition-colors duration-300">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="{{ '/' | relative_url }}" class="text-xl font-serif font-bold text-academic-900 dark:text-white tracking-tight">Moshiur Rahman</a>
            
            <!-- Desktop Nav -->
            <nav class="hidden md:flex space-x-8 text-sm font-medium text-gray-600 dark:text-gray-300 items-center">
                <!-- Highlight active link using Jekyll's page.url -->
                <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}text-academic-600 dark:text-blue-400{% endif %}">About</a>
                <a href="{{ '/research.html' | relative_url }}" class="nav-link {% if page.url == '/research.html' %}text-academic-600 dark:text-blue-400{% endif %}">Research</a>
                <a href="{{ '/teaching.html' | relative_url }}" class="nav-link {% if page.url == '/teaching.html' %}text-academic-600 dark:text-blue-400{% endif %}">Teaching</a>
                <a href="{{ '/experience.html' | relative_url }}" class="nav-link {% if page.url == '/experience.html' %}text-academic-600 dark:text-blue-400{% endif %}">Experience</a>
                <a href="{{ '/personal.html' | relative_url }}" class="nav-link {% if page.url == '/personal.html' %}text-academic-600 dark:text-blue-400{% endif %}">Personal</a>
                
                <!-- Dark Mode Toggle Button -->
                <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none rounded-lg text-sm p-2.5 transition-colors">
                    <i id="theme-toggle-dark-icon" class="hidden fas fa-moon"></i>
                    <i id="theme-toggle-light-icon" class="hidden fas fa-sun"></i>
                </button>
            </nav>

            <!-- Mobile Menu and Theme Buttons -->
            <div class="flex items-center gap-4 md:hidden">
                <button id="theme-toggle-mobile" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none rounded-lg text-sm p-2 transition-colors">
                    <i id="theme-toggle-dark-icon-mobile" class="hidden fas fa-moon"></i>
                    <i id="theme-toggle-light-icon-mobile" class="hidden fas fa-sun"></i>
                </button>
                <button class="text-gray-600 dark:text-gray-300 focus:outline-none" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
        </div>
        
        <!-- Mobile Nav -->
        <div id="mobile-menu" class="hidden md:hidden bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 px-6 py-4 space-y-4 shadow-lg transition-colors">
            <a href="{{ '/' | relative_url }}" class="block text-gray-600 dark:text-gray-300 hover:text-academic-600 dark:hover:text-blue-400">About</a>
            <a href="{{ '/research.html' | relative_url }}" class="block text-gray-600 dark:text-gray-300 hover:text-academic-600 dark:hover:text-blue-400">Research</a>
            <a href="{{ '/teaching.html' | relative_url }}" class="block text-gray-600 dark:text-gray-300 hover:text-academic-600 dark:hover:text-blue-400">Teaching</a>
            <a href="{{ '/experience.html' | relative_url }}" class="block text-gray-600 dark:text-gray-300 hover:text-academic-600 dark:hover:text-blue-400">Experience</a>
            <a href="{{ '/personal.html' | relative_url }}" class="block text-gray-600 dark:text-gray-300 hover:text-academic-600 dark:hover:text-blue-400">Personal</a>
        </div>
    </header>

    <!-- Main Content Injection -->
    <main class="flex-grow max-w-5xl mx-auto px-6 pt-32 pb-16 w-full space-y-24">
        {{ content }}
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 mt-auto transition-colors duration-300">
        <div class="max-w-5xl mx-auto px-6 py-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-sm text-gray-500 dark:text-gray-400">
                &copy; <span id="year"></span> {{ site.title }}. All rights reserved.
            </p>
            <p class="text-sm text-gray-400 dark:text-gray-500 text-center md:text-right">
                Designed with <i class="fas fa-heart text-red-400 dark:text-red-500 mx-1"></i> using Jekyll & Tailwind CSS.
            </p>
        </div>
        <script>
            document.getElementById('year').textContent = new Date().getFullYear();
        </script>
    </footer>

    <!-- Dark Mode Toggle Logic -->
    <script>
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
        const themeToggleDarkIconMobile = document.getElementById('theme-toggle-dark-icon-mobile');
        const themeToggleLightIconMobile = document.getElementById('theme-toggle-light-icon-mobile');

        // Set initial icon based on current mode
        if (document.documentElement.classList.contains('dark')) {
            themeToggleLightIcon.classList.remove('hidden');
            themeToggleLightIconMobile.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
            themeToggleDarkIconMobile.classList.remove('hidden');
        }

        const toggleTheme = function() {
            // Toggle icons
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');
            themeToggleDarkIconMobile.classList.toggle('hidden');
            themeToggleLightIconMobile.classList.toggle('hidden');

            // Toggle document class & set storage
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
        document.getElementById('theme-toggle-mobile').addEventListener('click', toggleTheme);
    </script>

</body>
</html>
